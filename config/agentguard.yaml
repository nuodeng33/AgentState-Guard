# AgentState Guard Configuration
# First version - manual edit only, no LLM generation

checks:
  commands:
    - docker
    - tailscale
    - node
    - python3
    - git
  container_name: agent-dev
  port: 3001

security:
  restore_whitelist:
    - ~/.claude/settings.json
    - ~/.claude/settings.local.json
    - ~/.claude/skills/strategic-compact/SKILL.md
    - ~/.claude/skills/context-compression/SKILL.md
    - ~/.claude/skills/filesystem-context/SKILL.md
  sanitize_patterns: []
  ignore_directories:
    - __pycache__
    - .git
    - node_modules
    - .npm-cache
    - .agentguard

paths:
  state_dir: .agentguard
  snapshot_dir: .agentguard/snapshots
  docs_dir: docs
  reports_dir: reports
  config_file: config/agentguard.yaml

docs:
  current_state: docs/CURRENT_STATE.md
  next_steps: docs/NEXT_STEPS.md
  decisions: docs/DECISIONS.md
  changelog: docs/CHANGELOG.md
