name: Desktop Windows
on:
  push:
    branches: [main, feat/**]
  pull_request:
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with: { node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json" }
      - working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: desktop-web-build
          path: agentguard/web_static/

  tauri-scaffold:
    runs-on: windows-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a  # v1
        with: { toolchain: stable }
      - name: Verify Tauri scaffold
        working-directory: desktop
        run: |
          echo "Tauri scaffold present — $(cargo --version)"
          echo "To complete Windows build: run 'cargo init' in desktop/src-tauri/"
          echo "Then: cargo install tauri-cli && cargo tauri build --debug"
