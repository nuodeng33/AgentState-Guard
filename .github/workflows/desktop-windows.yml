name: Desktop Windows
on:
  push:
    branches: [main, feat/**]
  pull_request:
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  SIDECAR_PORT: 8787

jobs:
  # ── Sidecar Build (PyInstaller) ───────────────────────────────
  sidecar-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v4.5.0
        with:
          python-version: "3.11"

      - name: Create sidecar entry point
        shell: cmd
        run: copy desktop\src-tauri\desktop_sidecar.py agentguard-sidecar.py

      - name: Build sidecar EXE
        run: pyinstaller --onefile --name agentguard-sidecar --hidden-import uvicorn --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websocket --hidden-import uvicorn.protocols.websocket.auto --hidden-import fastapi --hidden-import pydantic --hidden-import cryptography --hidden-import cryptography.hazmat --hidden-import cryptography.hazmat.backends.openssl --hidden-import cryptography.hazmat.primitives --collect-data agentguard agentguard-sidecar.py

      - name: Verify EXE
        run: |
          $path = "dist\agentguard-sidecar.exe"
          if (Test-Path $path) {
            $item = Get-Item $path
            $hash = Get-FileHash $path -Algorithm SHA256
            Write-Host "EXE OK: $($item.Length) bytes SHA256=$($hash.Hash)"
          } else {
            Write-Host "ERROR: EXE not found"
            exit 1
          }

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: agentguard-sidecar-exe
          path: dist/agentguard-sidecar.exe

  # ── Sidecar Standalone Smoke ──────────────────────────────────
  sidecar-smoke:
    runs-on: windows-latest
    needs: [sidecar-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: agentguard-sidecar-exe
          path: .

      - name: Start sidecar
        run: |
          $tmp = "$env:RUNNER_TEMP\agentguard-test"
          New-Item -ItemType Directory -Force -Path $tmp
          $proc = Start-Process -FilePath ".\agentguard-sidecar.exe" `
            -ArgumentList "--directory","$tmp","serve","--host","127.0.0.1","--port","$env:SIDECAR_PORT" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput "$tmp\sidecar.log" -RedirectStandardError "$tmp\sidecar.err"
          $proc.Id | Out-File -FilePath "$tmp\sidecar.pid"
          Write-Host "SIDECAR_PID=$($proc.Id)"
          echo "SIDECAR_TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Wait for health
        run: |
          $timeout = 30
          $url = "http://127.0.0.1:$env:SIDECAR_PORT/api/health"
          for ($i = 0; $i -lt $timeout; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "Health OK after ${i}s"
                return
              }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Write-Host "ERROR: Health timeout"
          Get-Content "$env:SIDECAR_TEMP\sidecar.log" -Tail 30
          exit 1

      - name: Verify bind address
        run: |
          $listeners = Get-NetTCPConnection -LocalPort $env:SIDECAR_PORT -ErrorAction SilentlyContinue
          foreach ($l in $listeners) {
            if ($l.LocalAddress -ne "127.0.0.1") {
              Write-Host "SECURITY_BOUNDARY_FAILURE: $($l.LocalAddress)"
              exit 1
            }
          }
          Write-Host "Bind OK: 127.0.0.1:$env:SIDECAR_PORT"

      - name: Test status API
        run: |
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$env:SIDECAR_PORT/api/status" -UseBasicParsing
          if ($resp.StatusCode -eq 200) { Write-Host "Status API OK" } else { exit 1 }

      - name: Test versions API
        run: |
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$env:SIDECAR_PORT/api/versions" -UseBasicParsing
          if ($resp.StatusCode -eq 200) { Write-Host "Versions API OK" } else { exit 1 }

      - name: Shutdown sidecar
        run: |
          $pid = Get-Content "$env:SIDECAR_TEMP\sidecar.pid" -ErrorAction SilentlyContinue
          if ($pid) {
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
            Write-Host "Terminated PID $pid"
          }

      - name: Verify orphan
        run: |
          $p = Get-Process -Name "agentguard-sidecar" -ErrorAction SilentlyContinue
          if ($p) {
            Write-Host "FAIL: SIDECAR_PROCESS_LEAK"
            exit 1
          }
          Write-Host "No orphan: clean shutdown"
