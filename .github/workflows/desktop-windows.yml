name: Desktop (Windows Tauri)
on:
  push:
    branches: [feat/v1-gui-release, feat/device-link]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with: { node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json" }
      - working-directory: web
        run: npm ci && npx vite build
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a  # v1
        with: { toolchain: stable }
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with: { path: ~/.cargo, key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }} }
      - working-directory: desktop
        run: cargo tauri build --debug
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with: { name: agentstate-guard-windows-debug, path: desktop/src-tauri/target/debug/agentstate-guard.exe }
