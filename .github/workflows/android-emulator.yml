name: Android Emulator Runtime
on:
  push:
    branches: [main, feat/**]
  pull_request:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b  # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      # ── Android SDK ────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/emulator" >> $GITHUB_PATH
          # Tell Gradle where the SDK is
          echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/android/local.properties

      - name: Install SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n AgentStateGuardTest \
            -k "system-images;android-34;google_apis;x86_64" \
            -d "pixel_6" \
            --abi x86_64 \
            --force
          echo "--- avdmanager create exit code: $? ---"
          echo "--- Verify AVD via avdmanager ---"
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd
          if $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd | grep -qi "AgentStateGuardTest"; then
            echo "avdmanager: AVD found in avdmanager list"
          else
            echo "ERROR: avdmanager list avd does not show AgentStateGuardTest"
            exit 1
          fi
          echo "--- Verify AVD via emulator -list-avds ---"
          EMU_LIST=$($ANDROID_HOME/emulator/emulator -list-avds 2>&1)
          echo "$EMU_LIST"
          if echo "$EMU_LIST" | grep -qi "AgentStateGuardTest"; then
            echo "emulator -list-avds: AVD found"
          else
            echo "ERROR: emulator -list-avds does not show AgentStateGuardTest"
            echo "--- AVD directory contents ---"
            ls -la $ANDROID_AVD_HOME/
            exit 1
          fi
          echo "AVD created and verified successfully"

      # ── KVM ────────────────────────────────────────────────────
      # Without KVM the x86_64 emulator cannot boot.  GitHub-hosted
      # runners have /dev/kvm; ensure the runner user can access it.
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM OK – /dev/kvm is accessible"
            ls -la /dev/kvm
          else
            echo "WARNING: /dev/kvm not found — emulator will use software rendering"
          fi

      # ── Build APK ──────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "APK=$APK"
          ls -lh "$APK"
          cp "$APK" agentstate-guard-debug.apk
          ls -lh agentstate-guard-debug.apk

      # ── Boot Emulator ──────────────────────────────────────────
      - name: Start emulator
        run: |
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          START_TS=$(date +%s)
          echo "EMULATOR_START_TS=$START_TS" >> $GITHUB_ENV
          nohup $ANDROID_HOME/emulator/emulator \
            -avd AgentStateGuardTest \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -netdelay none \
            -netspeed full \
            -no-snapshot \
            -verbose \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          echo "EMULATOR_PID=$EMULATOR_PID"
          # Brief pause then confirm the process is alive
          sleep 8
          if kill -0 $EMULATOR_PID 2>/dev/null; then
            echo "Emulator process $EMULATOR_PID is running"
            ps aux | grep -E "emulator|qemu" | head -5 || true
          else
            echo "ERROR: Emulator process died during startup"
            tail -100 emulator.log
            exit 1
          fi

      - name: Stream boot logcat (background)
        timeout-minutes: 10
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # Stream logcat to a file with timestamps for boot diagnostics
          adb logcat -v time > boot-logcat.txt 2>&1 &
          LOGCAT_PID=$!
          echo "LOGCAT_PID=$LOGCAT_PID"
          # Wait until boot completed
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Boot complete after ~${i}s"
              sleep 3
              # Record boot duration
              echo "BOOT_DURATION_SECONDS=$i" >> $GITHUB_ENV
              # Stop logcat stream
              kill $LOGCAT_PID 2>/dev/null || true
              exit 0
            fi
            # Print boot stage progress every cycle
            ZYGOTE=$(adb shell getprop sys.init.svc.zygote 2>/dev/null | tr -d '\r')
            SURFACEFLINGER=$(adb shell getprop sys.init.svc.surfaceflinger 2>/dev/null | tr -d '\r')
            BOOTANIM=$(adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')
            SERVICE_APP=$(adb shell getprop sys.init.svc.servicemanager 2>/dev/null | tr -d '\r')
            echo "[${i}s] boot_completed=$BOOT zygote=$ZYGOTE surfaceflinger=$SURFACEFLINGER bootanim=$BOOTANIM servicemanager=$SERVICE_APP"
            # Kill process check
            kill -0 $EMULATOR_PID 2>/dev/null || {
              echo "ERROR: Emulator PID $EMULATOR_PID died during boot"
              tail -100 emulator.log
              exit 1
            }
            # Print logcat summary every 5 iterations (25s)
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- logcat snapshot at ${i}s ---"
              adb logcat -d -t 50 2>/dev/null | grep -E "AndroidRuntime|FATAL|am_create|boot|BOOT" | tail -10 || echo "(no matching logcat lines)"
              echo "--- emulator.log tail ---"
              tail -20 emulator.log 2>/dev/null | grep -E "emulator:|boot|error|warning" | tail -10 || true
            fi
            printf "."
            sleep 5
          done
          echo ""
          echo "ERROR: Boot timeout after 10 minutes"
          echo "--- Final device properties ---"
          adb shell getprop 2>/dev/null | grep -E "sys\.(boot|init|power)" || true
          echo "--- Boot logcat summary ---"
          head -200 boot-logcat.txt 2>/dev/null | grep -E "AndroidRuntime|FATAL|boot_completed|Zygote|SurfaceFlinger" | tail -20 || true
          echo "--- Emulator log tail ---"
          tail -100 emulator.log
          kill $LOGCAT_PID 2>/dev/null || true
          exit 1

      - name: Report boot timing
        run: |
          echo "Boot completed in ${BOOT_DURATION_SECONDS:-unknown} seconds"
          echo "Logcat boot log: $(wc -l < boot-logcat.txt 2>/dev/null || echo 0) lines"

      # ── Runtime Smoke Tests ─────────────────────────────────────
      - name: Install APK
        run: |
          adb install -r agentstate-guard-debug.apk
          echo "APK installed successfully"

      - name: Launch app
        run: |
          adb shell am start -n com.agentstate.guard/.MainActivity
          sleep 5

      - name: Verify process alive
        run: |
          adb shell "ps -A | grep agent" || echo "(process may have exited — not an error)"
          adb shell dumpsys package com.agentstate.guard | grep -E "versionName|versionCode|firstInstallTime"

      - name: Check for crashes
        run: |
          if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
            echo "CRASH DETECTED"
            adb logcat -d -s AndroidRuntime:E | tail -30
            exit 1
          fi
          echo "No FATAL EXCEPTION found"

      - name: Check UI rendering
        run: |
          adb shell dumpsys activity activities | grep -E "com.agentstate.guard|mResumedActivity" | head -5 || \
            echo "(activity info not found in dumpsys)"
          if adb shell dumpsys activity activities | grep -qi "ANR"; then
            echo "ANR DETECTED"
            adb shell dumpsys activity activities | grep -i "ANR"
            exit 1
          fi
          echo "No ANR"

      # ── Gateway Integration ─────────────────────────────────────
      - name: Setup Python for Gateway
        run: pip install -e ".[dev]"

      - name: Start Gateway
        run: |
          python -m agentguard --directory "$PWD" serve --port 8790 &
          GATEWAY_PID=$!
          echo "GATEWAY_PID=$GATEWAY_PID" >> $GITHUB_ENV
          sleep 3
          # Verify health endpoint
          curl -s http://127.0.0.1:8790/api/health | grep -q "ok" && echo "Health endpoint OK"
          # Verify device link endpoint
          START_RESP=$(curl -s -X POST http://127.0.0.1:8790/device/v1/pair/start)
          echo "pair/start response: $START_RESP"
          echo "$START_RESP" | grep -q "session_id" && echo "Device link endpoint OK"
          echo "GATEWAY_PORT=8790" >> $GITHUB_ENV

      - name: Android -> Gateway test (instrumented via DeviceLinkClient)
        run: |
          echo "Running DeviceLinkClient instrumented test against Gateway..."
          cd android
          ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.gateway_host=10.0.2.2 -Pandroid.testInstrumentationRunnerArguments.gateway_port=8790 2>&1 || true
          # Show test results regardless of pass/fail
          echo "--- Instrumented test results ---"
          find . -path "*/test-results/*" -name "*.xml" | head -5
          for f in $(find . -path "*/test-results/*" -name "*.xml" | head -5); do
            echo "=== $(basename $f) ==="
            head -50 "$f"
          done
          echo "--- Gradle test output summary ---"
          grep -r "testCount\|tests ran\|FAILED\|PASSED\|tests=" app/build/reports/ 2>/dev/null | head -20 || echo "(no reports)"
          # Fallback: verify Gateway is reachable from emulator via basic HTTP
          echo "--- Network reachability check ---"
          adb shell "echo 'GET /device/v1/pair/start' | nc 10.0.2.2 8790" 2>/dev/null && echo "Gateway reachable via nc" || \
            echo "nc not available, but instrumented test result above is authoritative"

      # ── Collect Evidence ───────────────────────────────────────
      - name: Capture screenshot
        if: always()
        run: |
          mkdir -p emulator-logs
          timeout 10 adb shell screencap -p /sdcard/screenshot.png
          timeout 10 adb pull /sdcard/screenshot.png emulator-logs/screenshot.png 2>/dev/null || \
            echo "Screenshot capture failed (may not be supported)"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p emulator-logs
          timeout 10 adb logcat -d > emulator-logs/logcat.txt 2>/dev/null || echo "logcat capture failed or timed out"
          timeout 10 adb shell dumpsys activity activities > emulator-logs/dumpsys-activity.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys package com.agentstate.guard > emulator-logs/dumpsys-package.txt 2>/dev/null || true
          cp emulator.log emulator-logs/emulator.log 2>/dev/null || true
          echo "Logs collected in emulator-logs/"
          grep -rEi "sk-ant|ghp_|xox[baprs]-|Bearer [A-Za-z0-9]" emulator-logs/ && \
            { echo "SECRET FOUND!"; exit 1; } || \
            echo "No secrets in logs"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        if: always()
        with:
          name: emulator-logs
          path: emulator-logs/
          retention-days: 3

      - name: Stop emulator
        if: always()
        run: adb emu kill 2>/dev/null || true
