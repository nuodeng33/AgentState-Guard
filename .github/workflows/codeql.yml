name: CodeQL
on: [push, pull_request]
permissions: read-all
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@6a01f8188b0a1e7b1e4d0d6b5e2a7f1e8c0d3b2 # v3.28.0
        with: { languages: python }
      - uses: github/codeql-action/analyze@6a01f8188b0a1e7b1e4d0d6b5e2a7f1e8c0d3b2 # v3.28.0
