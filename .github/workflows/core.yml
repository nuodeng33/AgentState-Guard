name: Core CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: core-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short --junitxml=artifacts/core-tests-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: always()
        with:
          name: core-tests-${{ matrix.python }}
          path: artifacts/core-tests-${{ matrix.python }}.xml
          if-no-files-found: warn
      - run: python -m agentguard --help
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with: { node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json" }
      - working-directory: web
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npx vite build
  local-workflow:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with: { python-version: "3.12" }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json" }
      - run: pip install -e ".[dev]"
      - working-directory: web
        run: npm ci && npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/asg-playwright" --no-save playwright@1.64.1
          node "$RUNNER_TEMP/asg-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real Core manual work and native recovery acceptance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/asg-playwright/node_modules/playwright
        run: python scripts/verify_local_workflow.py --temp-root "$RUNNER_TEMP"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: always()
        with:
          name: local-workflow-evidence
          path: artifacts/local-workflow/
          if-no-files-found: warn
  wheel:
    runs-on: ubuntu-latest
    needs: [test, frontend, local-workflow]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with: { python-version: "3.11" }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: "22", cache: "npm", cache-dependency-path: "web/package-lock.json" }
      - working-directory: web
        run: npm ci && npx vite build
      - run: pip install build && python -m build
      - name: Verify wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/agentguard-wheel"
          "$RUNNER_TEMP/agentguard-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          actual=$("$RUNNER_TEMP/agentguard-wheel/bin/python" -c \
            'from agentguard.core.versions import exact_product_sha; print(exact_product_sha())')
          test "$actual" = "$GITHUB_SHA"
          "$RUNNER_TEMP/agentguard-wheel/bin/pip" check
          "$RUNNER_TEMP/agentguard-wheel/bin/agentguard" --help
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with: { name: wheel, path: dist/*.whl }
