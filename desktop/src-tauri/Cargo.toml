[package]
name = "agentstate-guard"
version = "0.9.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
dirs-next = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
