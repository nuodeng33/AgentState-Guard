[project]
name = "agentstate-guard"
version = "0.9.0-dev"
description = "AgentState Guard — protect Claude Code / CloudCLI / Docker / Tailscale environment state"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
agentguard = ["web_static/**/*"]
