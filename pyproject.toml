[project]
name = "agentstate-guard"
version = "0.9.0.dev0"
description = "AgentState Guard — protect Claude Code / CloudCLI / Docker environment state"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "psutil>=7.2.2,<8",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["cryptography>=41.0", "pytest", "httpx2>=2,<3", "ruff", "mypy"]

[project.scripts]
agentguard = "agentguard.cli:main"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
agentguard = ["web_static/**/*"]
